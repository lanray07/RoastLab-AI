name: Xcode App Store Upload

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Optional App Store build number. Defaults to the GitHub run number."
        required: false
        type: string

permissions:
  contents: read

jobs:
  archive-upload:
    name: Archive and upload RoastLab AI
    runs-on: macos-15
    timeout-minutes: 60

    env:
      PROJECT_PATH: RoastLabAI.xcodeproj
      SCHEME: RoastLabAI
      CONFIGURATION: Release
      BUNDLE_IDENTIFIER: com.roastlab.ai
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          set -euo pipefail
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret for $name"
              exit 1
            fi
          done

      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Write App Store Connect API key
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/appstoreconnect" "$HOME/.appstoreconnect/private_keys"
          python3 - <<'PY'
          import os
          from pathlib import Path

          key_id = os.environ["ASC_KEY_ID"]
          private_key = os.environ["ASC_PRIVATE_KEY"].replace("\\n", "\n").strip() + "\n"
          for directory in [
              Path(os.environ["RUNNER_TEMP"]) / "appstoreconnect",
              Path.home() / ".appstoreconnect" / "private_keys",
          ]:
              path = directory / f"AuthKey_{key_id}.p8"
              path.write_text(private_key)
              path.chmod(0o600)
          PY

      - name: Show project configuration
        run: |
          set -euo pipefail
          xcodebuild -list -project "$PROJECT_PATH"
          xcodebuild -showBuildSettings \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_IDENTIFIER" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            | tee "$RUNNER_TEMP/build-settings.txt"

      - name: Archive
        run: |
          set -euo pipefail
          BUILD_NUMBER="${{ github.run_number }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.build_number }}" ]; then
            BUILD_NUMBER="${{ inputs.build_number }}"
          fi

          echo "Using build number: $BUILD_NUMBER"
          xcodebuild clean archive \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/RoastLabAI.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/appstoreconnect/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_IDENTIFIER" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            | tee "$RUNNER_TEMP/archive.log"

      - name: Export IPA
        run: |
          set -euo pipefail

          write_export_options() {
            local method="$1"
            cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>export</string>
            <key>method</key>
            <string>${method}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          }

          write_export_options "app-store-connect"
          if ! xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/RoastLabAI.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/appstoreconnect/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tee "$RUNNER_TEMP/export.log"; then
            echo "Retrying export with legacy app-store method..."
            rm -rf "$RUNNER_TEMP/export"
            write_export_options "app-store"
            xcodebuild -exportArchive \
              -archivePath "$RUNNER_TEMP/RoastLabAI.xcarchive" \
              -exportPath "$RUNNER_TEMP/export" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$RUNNER_TEMP/appstoreconnect/AuthKey_${ASC_KEY_ID}.p8" \
              -authenticationKeyID "$ASC_KEY_ID" \
              -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
              | tee "$RUNNER_TEMP/export.log"
          fi

          IPA_PATH="$(find "$RUNNER_TEMP/export" -name "*.ipa" -print -quit)"
          if [ -z "$IPA_PATH" ]; then
            echo "::error::No IPA was exported."
            exit 1
          fi
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Upload IPA to App Store Connect
        run: |
          set -euo pipefail
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-app-store-upload-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
            ${{ runner.temp }}/build-settings.txt
            ${{ runner.temp }}/export/*.ipa
          if-no-files-found: ignore
